name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Device-backed behaviour can't run on hosted runners (no phone attached), so CI
# guards what it can: the package imports, its full API surface is present, and
# every source/example file parses on each supported Node version and OS.
jobs:
  build:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax-check sources and examples
        shell: bash
        run: |
          set -e
          find src examples scripts -name '*.js' -o -name '*.mjs' | while read -r f; do
            node --check "$f"
          done
          echo "All files parsed."

      - name: Import / API-surface smoke test
        run: node scripts/smoke.mjs
